<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Meeting - LiveKit</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="notification" id="notification"></div>

  <div class="join-container">
    <div class="card">
      <h1>🎥 Join Meeting</h1>
      <p class="subtitle" id="roomInfo">Loading room details...</p>

      <form id="joinForm">
        <div class="input-group">
          <label>Your Name</label>
          <input type="text" id="userName" placeholder="Enter your name" maxlength="50" required>
          <div class="error-message" id="userNameError"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="joinBtn">
          Join Meeting
        </button>
      </form>

      <div class="back-link">
        <a href="/">← Create your own meeting</a>
      </div>
    </div>
  </div>

  <script src="/js/join.js"></script>
</body>
</html>
