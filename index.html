<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Conference - LiveKit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a1a;
      color: white;
      overflow: hidden;
    }

    /* Join Screen */
    #joinScreen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .join-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 400px;
    }

    .join-container h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      color: #555;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .join-btn {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .join-btn:hover {
      background: #5568d3;
    }

    /* Meeting Screen */
    #meetingScreen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    /* Header */
    .meeting-header {
      background: #262626;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .room-info h2 {
      font-size: 18px;
      color: #fff;
    }

    .participant-count {
      color: #888;
      font-size: 14px;
      margin-top: 4px;
    }

    /* Video Grid */
    .video-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 10px;
      padding: 20px;
      overflow-y: auto;
      background: #1a1a1a;
    }

    .video-tile {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
    }

    .video-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-tile .participant-name {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
    }

    .video-tile .mic-status {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      padding: 6px;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Controls */
    .controls {
      background: #262626;
      padding: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      border-top: 1px solid #333;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn.mic {
      background: #3c4043;
      color: white;
    }

    .control-btn.mic.muted {
      background: #ea4335;
    }

    .control-btn.video {
      background: #3c4043;
      color: white;
    }

    .control-btn.video.off {
      background: #ea4335;
    }

    .control-btn.leave {
      background: #ea4335;
      color: white;
      width: 60px;
    }

    .control-btn:hover {
      transform: scale(1.1);
    }

    .control-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <!-- Join Screen -->
  <div id="joinScreen">
    <div class="join-container">
      <h1>🎥 Join Meeting</h1>
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" id="userName" placeholder="Enter your name" value="Rahman">
      </div>
      <div class="input-group">
        <label>Room Name</label>
        <input type="text" id="roomName" placeholder="Enter room name" value="test-room">
      </div>
      <button class="join-btn" id="joinBtn">Join Meeting</button>
    </div>
  </div>

  <!-- Meeting Screen -->
  <div id="meetingScreen">
    <div class="meeting-header">
      <div class="room-info">
        <h2 id="roomTitle">Room Name</h2>
        <div class="participant-count" id="participantCount">0 participants</div>
      </div>
    </div>

    <div class="video-container" id="videoContainer">
      <!-- Video tiles will be added here -->
    </div>

    <div class="controls">
      <button class="control-btn mic" id="micBtn" title="Toggle Microphone">🎤</button>
      <button class="control-btn video" id="videoBtn" title="Toggle Camera">📹</button>
      <button class="control-btn leave" id="leaveBtn" title="Leave Meeting">📞</button>
    </div>
  </div>

  <script type="module">
    import { Room } from 'https://unpkg.com/livekit-client/dist/livekit-client.esm.mjs';

    let room = null;
    let isMicOn = true;
    let isVideoOn = true;

    // Elements
    const joinScreen = document.getElementById('joinScreen');
    const meetingScreen = document.getElementById('meetingScreen');
    const joinBtn = document.getElementById('joinBtn');
    const userNameInput = document.getElementById('userName');
    const roomNameInput = document.getElementById('roomName');
    const videoContainer = document.getElementById('videoContainer');
    const roomTitle = document.getElementById('roomTitle');
    const participantCount = document.getElementById('participantCount');
    const micBtn = document.getElementById('micBtn');
    const videoBtn = document.getElementById('videoBtn');
    const leaveBtn = document.getElementById('leaveBtn');

    // Join Meeting
    joinBtn.onclick = async () => {
      const userName = userNameInput.value.trim();
      const roomName = roomNameInput.value.trim();

      if (!userName || !roomName) {
        alert('Please enter both name and room name');
        return;
      }

      try {
        joinBtn.textContent = 'Joining...';
        joinBtn.disabled = true;

        // Get token from backend
        const res = await fetch('/get-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roomName, userName })
        });

        const { token } = await res.json();

        // Connect to room
        room = new Room();
        await room.connect('wss://practice-am64s12w.livekit.cloud', token);

        // Setup event listeners first
        setupRoomEvents();

        // Switch to meeting screen
        joinScreen.style.display = 'none';
        meetingScreen.style.display = 'flex';
        roomTitle.textContent = roomName;

        // Enable camera and mic
        await room.localParticipant.enableCameraAndMicrophone();

        // Add local video after enabling camera
        setTimeout(() => {
          addLocalVideo();
          updateParticipantCount();
        }, 500);

        // Add existing participants
        if (room.participants && room.participants.size > 0) {
          room.participants.forEach(participant => {
            addVideoTile(participant, false);
          });
        }

      } catch (error) {
        console.error('Error joining room:', error);
        alert('Failed to join meeting: ' + error.message);
        joinBtn.textContent = 'Join Meeting';
        joinBtn.disabled = false;
      }
    };

    // Add local video
    function addLocalVideo() {
      const participant = room.localParticipant;
      
      // Remove existing tile if any
      const existingTile = document.getElementById(`tile-${participant.identity}`);
      if (existingTile) existingTile.remove();

      const tile = document.createElement('div');
      tile.className = 'video-tile';
      tile.id = `tile-${participant.identity}`;

      const name = document.createElement('div');
      name.className = 'participant-name';
      name.textContent = `${participant.identity} (You)`;

      const micStatus = document.createElement('div');
      micStatus.className = 'mic-status';
      micStatus.textContent = '🎤';
      micStatus.id = `mic-${participant.identity}`;

      tile.appendChild(name);
      tile.appendChild(micStatus);
      videoContainer.appendChild(tile);

      console.log('Video track publications:', participant.videoTrackPublications);

      // Get camera track from videoTrackPublications
      if (participant.videoTrackPublications && participant.videoTrackPublications.size > 0) {
        participant.videoTrackPublications.forEach(publication => {
          if (publication.track) {
            console.log('Attaching local video track');
            const videoEl = publication.track.attach();
            videoEl.style.transform = 'scaleX(-1)'; // Mirror effect
            videoEl.style.width = '100%';
            videoEl.style.height = '100%';
            videoEl.style.objectFit = 'cover';
            tile.insertBefore(videoEl, name);
          }
        });
      } else {
        console.log('No video tracks available yet, waiting...');
      }

      // Listen for track published (in case track wasn't ready)
      participant.on('trackPublished', (publication) => {
        console.log('Local track published:', publication.kind);
        if (publication.kind === 'video' && publication.track) {
          const existingVideo = tile.querySelector('video');
          if (!existingVideo) {
            const videoEl = publication.track.attach();
            videoEl.style.transform = 'scaleX(-1)';
            videoEl.style.width = '100%';
            videoEl.style.height = '100%';
            videoEl.style.objectFit = 'cover';
            tile.insertBefore(videoEl, name);
            console.log('Video attached via trackPublished event');
          }
        }
      });
    }

    // Add video tile
    function addVideoTile(participant, isLocal = false) {
      const existingTile = document.getElementById(`tile-${participant.identity}`);
      if (existingTile) return;

      const tile = document.createElement('div');
      tile.className = 'video-tile';
      tile.id = `tile-${participant.identity}`;

      const name = document.createElement('div');
      name.className = 'participant-name';
      name.textContent = participant.identity;

      const micStatus = document.createElement('div');
      micStatus.className = 'mic-status';
      micStatus.textContent = '🎤';
      micStatus.id = `mic-${participant.identity}`;

      tile.appendChild(name);
      tile.appendChild(micStatus);
      videoContainer.appendChild(tile);
    }

    // Remove video tile
    function removeVideoTile(participant) {
      const tile = document.getElementById(`tile-${participant.identity}`);
      if (tile) tile.remove();
    }

    // Setup room events
    function setupRoomEvents() {
      // Participant joined
      room.on('participantConnected', (participant) => {
        console.log('Participant joined:', participant.identity);
        addVideoTile(participant);
        updateParticipantCount();
      });

      // Participant left
      room.on('participantDisconnected', (participant) => {
        console.log('Participant left:', participant.identity);
        removeVideoTile(participant);
        updateParticipantCount();
      });

      // Track subscribed
      room.on('trackSubscribed', (track, publication, participant) => {
        if (track.kind === 'video') {
          const tile = document.getElementById(`tile-${participant.identity}`);
          if (tile) {
            const videoEl = track.attach();
            const name = tile.querySelector('.participant-name');
            tile.insertBefore(videoEl, name);
          }
        } else if (track.kind === 'audio') {
          track.attach();
        }
      });

      // Track unsubscribed
      room.on('trackUnsubscribed', (track, publication, participant) => {
        track.detach();
      });
    }

    // Update participant count
    function updateParticipantCount() {
      if (!room || !room.participants) {
        participantCount.textContent = '1 participant';
        return;
      }
      const count = room.participants.size + 1; // +1 for local participant
      participantCount.textContent = `${count} participant${count > 1 ? 's' : ''}`;
    }

    // Toggle Microphone
    micBtn.onclick = async () => {
      isMicOn = !isMicOn;
      await room.localParticipant.setMicrophoneEnabled(isMicOn);
      micBtn.classList.toggle('muted', !isMicOn);
      micBtn.textContent = isMicOn ? '🎤' : '🔇';
    };

    // Toggle Video
    videoBtn.onclick = async () => {
      isVideoOn = !isVideoOn;
      await room.localParticipant.setCameraEnabled(isVideoOn);
      videoBtn.classList.toggle('off', !isVideoOn);
      videoBtn.textContent = isVideoOn ? '📹' : '📷';
    };

    // Leave Meeting
    leaveBtn.onclick = async () => {
      if (room) {
        await room.disconnect();
        room = null;
      }
      
      videoContainer.innerHTML = '';
      meetingScreen.style.display = 'none';
      joinScreen.style.display = 'flex';
      joinBtn.textContent = 'Join Meeting';
      joinBtn.disabled = false;
      isMicOn = true;
      isVideoOn = true;
      micBtn.classList.remove('muted');
      videoBtn.classList.remove('off');
      micBtn.textContent = '🎤';
      videoBtn.textContent = '📹';
    };
  </script>
</body>
</html>
